<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanyam’s Gaming & Global Travels</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1d4ed8; --bg: #ffffff; }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: #0f172a; scroll-behavior: smooth; }
        
        .munro-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            z-index: 2000;
            text-align: center;
        }
        .badge-count { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: block; line-height: 1.2; }
        .badge-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: 700; }

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Pointing to your LOCAL uploaded file */
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4)), 
                        url('/static/images/hero.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
        }

        .hero h1 { font-size: 3.5rem; text-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: 0; padding: 0 20px; }

        .section { padding: 60px 20px; max-width: 1100px; margin: 0 auto; }
        
        #map { height: 600px; width: 100%; border-radius: 20px; border: 1px solid #e2e8f0; z-index: 1; }

        .map-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .legend { font-size: 0.85rem; background: #f8fafc; padding: 8px 16px; border-radius: 8px; border: 1px solid #e2e8f0; font-weight: 600; }
    </style>
</head>
<body>

    <div class="munro-badge">
        <span class="badge-count">52 / 282</span>
        <span class="badge-label">Munros Bagged</span>
    </div>

    <section class="hero">
        <h1>Sanyam’s Gaming & Global Travels</h1>
    </section>

    <section class="section">
        <div class="map-header">
            <h2 style="margin:0;">Scotland Tracker</h2>
            <div class="legend">
                <span style="color: #ef4444">●</span> Munros | <span style="color: #3b82f6">●</span> Cities
            </div>
        </div>
        <div id="map"></div>
    </section>

    <section class="section" style="text-align: center; padding-top: 0;">
        <div style="display: flex; gap: 20px; justify-content: center;">
            <a href="/munros" style="text-decoration: none; background: var(--primary); color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);">
                Expand Munro Map →
            </a>
            
            <a href="/travels" style="text-decoration: none; background: #0f172a; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                Explore Travel Stories →
            </a>
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Initialize Map
            var map = L.map('map').setView([56.81, -4.18], 7); 
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // 2. Marker Function
            function addMunro(lat, lon, name, id, date) {
                L.circleMarker([lat, lon], {
                    radius: 8, 
                    fillColor: "#ef4444", 
                    color: "#fff", 
                    weight: 2, 
                    fillOpacity: 0.9
                }).addTo(map).bindPopup(`
                    <div style="text-align:center; font-family: 'Outfit'; min-width:150px;">
                        <b style="font-size:1.1rem; display:block; margin-bottom:5px;">${name}</b>
                        <span style="color:#64748b; font-size:0.9rem;">Bagged: ${date}</span><br><br>
                        <a href="/munro/${id}" style="background:#1d4ed8; color:white; padding:8px 12px; border-radius:5px; text-decoration:none; display:inline-block; font-weight:bold;">View Story</a>
                    </div>
                `);
